# PeakNet Pipeline Configuration
defaults:
  - _self_
  - experiment: null

# Core pipeline parameters
gpu_id: 0
shape: [1, 512, 512]  # Tensor shape as [C, H, W] - single channel for detector images
num_samples: 1000
batch_size: 10
warmup_samples: 100

# PeakNet model configuration
peaknet:
  yaml_path: null  # Path to PeakNet YAML configuration file (set to null for no-op mode)
  weights_path: null  # Path to pre-trained weights (optional)

# Test control
test:
  sync_frequency: 10
  skip_warmup: false
  deterministic: false

# Performance and memory settings
performance:
  pin_memory: true
  compile_model: false
  compile_mode: default  # Options: default, reduce-overhead, max-autotune

# Legacy/deprecated (kept for compatibility)
nsys_report: null