# @package _global_
# Huge PeakNet model (673M parameters) with default compilation
# Based on peaknet-673m.yaml configuration

# Update tensor shape for huge model's 1920x1920 input size
shape: [1, 1920, 1920]  # Single channel, huge input size

peaknet:
  yaml_path: /sdf/data/lcls/ds/prj/prjcwang31/results/proj-peaknet/experiments/yaml/peaknet-673m.yaml
  weights_path: null  # No pre-trained weights - use initialized model

performance:
  compile_model: true
  compile_mode: default  # Safe compilation mode for huge model
  pin_memory: true  # Important for large tensors

# Conservative settings for huge model with compilation
batch_size: 1  # Start with batch size 1 due to memory constraints
num_samples: 50  # Fewer samples since inference will be much slower
warmup_samples: 50  # More warmup needed for compilation

# Test control - adjusted for large model
test:
  sync_frequency: 5  # More frequent progress updates
  skip_warmup: false
  deterministic: false