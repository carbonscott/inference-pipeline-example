# ViT Pipeline Configuration
defaults:
  - _self_
  - model: vit_small  # Default to ViT-Small model
  - experiment: null
  - ray: null

# Core pipeline parameters
gpu_id: 0
shape: [3, 224, 224]  # Tensor shape as [C, H, W] - should match vit.channels
num_samples: 1000
batch_size: 10
warmup_samples: 100

# ViT model configuration is now loaded from model templates
# Override specific parameters here if needed
# vit:
#   depth: 0  # Set to 0 for no-op mode

# Test control
test:
  sync_frequency: 10
  skip_warmup: false
  deterministic: false

# Performance and memory settings
performance:
  pin_memory: true
  compile_model: false
  compile_mode: default  # Options: default, reduce-overhead, max-autotune

# Legacy/deprecated (kept for compatibility)
nsys_report: null