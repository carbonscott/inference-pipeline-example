# @package _global_
# ViT-Base model with patch_size=32 configuration
# Fewer patches, faster processing for large images
vit:
  patch_size: 32
  depth: 12
  heads: 12
  dim: 768
  mlp_dim: 3072  # 4x dim
  channels: 3  # RGB input by default
  dropout: 0.0
  emb_dropout: 0.0

# Expected parameter count: ~86M (same as base, but fewer patches)
# Typical use cases: Large image processing, reduced memory usage