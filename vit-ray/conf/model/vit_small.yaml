# @package _global_
# ViT-Small model configuration  
# Good balance between performance and computational cost
vit:
  patch_size: 16
  depth: 12
  heads: 6
  dim: 384
  mlp_dim: 1536  # 4x dim
  channels: 3  # RGB input by default
  dropout: 0.0
  emb_dropout: 0.0

# Expected parameter count: ~22M
# Typical use cases: Standard inference tasks, balanced performance/speed